[project]
name = "bookmatch"
version = "0.1.0"
description = "An agentic AI system for donated book classification and reader matching."
readme = "README.md"
authors = [
    { name = "Nick Li", email = "326444272+NickLi2027@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.6.0",
    "pydantic>=2.13.5",
]

[project.scripts]
bookmatch = "bookmatch:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
